server {
    listen 8099 default_server;

    root            /dev/null;
    server_name     $hostname;

    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Robots-Tag none;


    proxy_http_version          1.1;
    proxy_ignore_client_abort   off;
    proxy_redirect              off;
    proxy_send_timeout          86400s;
    proxy_read_timeout          86400s;

    absolute_redirect off;

    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-NginX-Proxy true;
    proxy_set_header X-Real-IP $remote_addr;

    allow   127.0.0.1;
    allow   172.30.32.2;
    deny    all;

    location / {
        proxy_set_header Origin "";
        # The backend redirects / to /web; keep that redirect inside the ingress path.
        # Since TeddyCloud v0.7.1 the web UI derives its URL prefix from the browser
        # location at runtime, so responses no longer need to be rewritten.
        proxy_redirect '/' $http_x_ingress_path/;

        proxy_pass http://backend;
    }
}
