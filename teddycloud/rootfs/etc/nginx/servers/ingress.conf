server {
    listen 8099 default_server;

    root            /dev/null;
    server_name     $hostname;

    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Robots-Tag none;


    proxy_http_version          1.1;
    proxy_ignore_client_abort   off;
    proxy_redirect              off;
    proxy_send_timeout          86400s;
    proxy_read_timeout          86400s;
    proxy_max_temp_file_size    40960m;

    absolute_redirect off;

    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-NginX-Proxy true;
    proxy_set_header X-Real-IP $remote_addr;

    allow   127.0.0.1;
    allow   172.30.32.2;
    deny    all;

    location / {
        proxy_set_header Origin "";
        proxy_redirect '/' $http_x_ingress_path/;

        # The web UI is built with root-absolute paths (/web, /api, ...). Prefix them
        # with the ingress path in every text response. Patterns are keyed on the
        # character preceding the path (quote, backtick, url() so they survive
        # re-minification of the bundle. Backtick and single-quote patterns can only
        # hit JavaScript; double-quote patterns may also hit JSON API responses.
        sub_filter_types text/xml text/css text/json text/javascript application/javascript application/json;
        sub_filter_once off;

        # HTML attributes (index.html, legacy.html, 404.html)
        sub_filter 'href="/' 'href="$http_x_ingress_path/';
        sub_filter 'src="/' 'src="$http_x_ingress_path/';

        # CSS asset references (fonts) emitted by the Vite build
        sub_filter 'url(/web/' 'url($http_x_ingress_path/web/';

        # JavaScript path literals. Deliberately NOT rewritten: /custom_img/ (compared
        # against and stored as data), bare `/library${...}` (a file path, not a URL)
        # and `/plugins/<id>` router links (the router adds the prefixed basename).
        sub_filter '`/api/' '`$http_x_ingress_path/api/';
        sub_filter '"/api/' '"$http_x_ingress_path/api/';
        sub_filter "'/api/" "'$http_x_ingress_path/api/";
        sub_filter '`/v1/' '`$http_x_ingress_path/v1/';
        sub_filter "'/v1/" "'$http_x_ingress_path/v1/";
        sub_filter '`/reverse/' '`$http_x_ingress_path/reverse/';
        sub_filter '/reverseGeneric/' '$http_x_ingress_path/reverseGeneric/';
        sub_filter '`/web' '`$http_x_ingress_path/web';
        sub_filter '"/web/' '"$http_x_ingress_path/web/';
        sub_filter '`/content/' '`$http_x_ingress_path/content/';
        sub_filter '`/library/' '`$http_x_ingress_path/library/';
        sub_filter 'src:`/plugins/' 'src:`$http_x_ingress_path/plugins/';
        sub_filter 'Raw(`/plugins/' 'Raw(`$http_x_ingress_path/plugins/';
        sub_filter '`/cache/' '`$http_x_ingress_path/cache/';
        sub_filter '`/img_unknown.png' '`$http_x_ingress_path/img_unknown.png';
        sub_filter '"/img_unknown.png"' '"$http_x_ingress_path/img_unknown.png"';

        # JSON API responses: paths the backend returns and the UI uses verbatim
        sub_filter ',"audioUrl":"/content' ',"audioUrl":"$http_x_ingress_path/content';
        sub_filter ',"downloadTriggerUrl":"/content' ',"downloadTriggerUrl":"$http_x_ingress_path/content';
        sub_filter ',"picture":"/cache' ',"picture":"$http_x_ingress_path/cache';
        sub_filter ',"img_src":"/cache' ',"img_src":"$http_x_ingress_path/cache';

        proxy_pass http://backend;
    }
}
